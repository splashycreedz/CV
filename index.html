<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  :root {
    --bg: #0b1020;
    --panel: #11182b;
    --panel2: #18223a;
    --text: #f4f7ff;
    --muted: #9aa7c2;
    --accent: #65e572;
    --accent2: #b4ff73;
    --danger: #ff5d73;
    --grid: rgba(255,255,255,.045);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    color: var(--text);
    background:
      radial-gradient(circle at 50% 0%, rgba(101,229,114,.10), transparent 35%),
      var(--bg);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .game {
    width: min(94vw, 620px);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  h1 {
    margin: 0;
    font-size: clamp(28px, 7vw, 42px);
    letter-spacing: -1px;
  }

  .stats {
    display: flex;
    gap: 8px;
  }

  .stat {
    min-width: 78px;
    padding: 8px 12px;
    text-align: center;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    background: rgba(17,24,43,.85);
  }

  .stat span {
    display: block;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
  }

  .stat strong { font-size: 20px; }

  .board-wrap {
    position: relative;
    padding: 10px;
    border-radius: 20px;
    background: linear-gradient(145deg, #1b2945, #0d1528);
    box-shadow: 0 20px 60px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  }

  canvas {
    display: block;
    width: 100%;
    aspect-ratio: 1;
    border-radius: 12px;
    background-color: #0b1222;
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 5% 5%;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 10px;
    display: grid;
    place-items: center;
    padding: 20px;
    border-radius: 12px;
    background: rgba(5, 9, 18, .72);
    backdrop-filter: blur(5px);
    text-align: center;
  }

  .overlay.hidden { display: none; }

  .message h2 {
    margin: 0 0 8px;
    font-size: clamp(30px, 8vw, 48px);
  }

  .message p {
    margin: 0 0 18px;
    color: var(--muted);
  }

  button {
    border: 0;
    color: #071008;
    background: var(--accent);
    font: inherit;
    font-weight: 800;
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }

  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(.96); }

  .primary {
    padding: 12px 22px;
    border-radius: 12px;
  }

  .controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
  }

  .hint {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }

  .pause {
    padding: 9px 13px;
    border-radius: 10px;
    color: var(--text);
    background: var(--panel2);
    border: 1px solid rgba(255,255,255,.08);
  }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(2, 52px);
    gap: 6px;
    width: max-content;
    margin: 18px auto 0;
  }

  .dpad button {
    border-radius: 12px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    font-size: 22px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .up { grid-column: 2; }
  .left { grid-column: 1; grid-row: 2; }
  .down { grid-column: 2; grid-row: 2; }
  .right { grid-column: 3; grid-row: 2; }

  @media (min-width: 700px) {
    .dpad { display: none; }
  }

  @media (max-width: 480px) {
    body { padding: 12px; }
    header { align-items: flex-start; }
    .stat { min-width: 68px; padding: 7px 9px; }
    .hint { font-size: 12px; }
  }
</style>
</head>
<body>
<main class="game">
  <header>
    <h1>🐍 Snake</h1>
    <div class="stats">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Best</span><strong id="best">0</strong></div>
    </div>
  </header>

  <section class="board-wrap">
    <canvas id="board" width="600" height="600" aria-label="Snake game board"></canvas>

    <div id="overlay" class="overlay">
      <div class="message">
        <h2 id="overlayTitle">Snake</h2>
        <p id="overlayText">Eat the food. Don't hit the walls or yourself.</p>
        <button id="startBtn" class="primary">Start Game</button>
      </div>
    </div>
  </section>

  <div class="controls">
    <div class="hint">Arrow keys / WASD to move · Space to pause</div>
    <button id="pauseBtn" class="pause">Pause</button>
  </div>

  <div class="dpad" aria-label="Touch controls">
    <button class="up" data-dir="up" aria-label="Up">▲</button>
    <button class="left" data-dir="left" aria-label="Left">◀</button>
    <button class="down" data-dir="down" aria-label="Down">▼</button>
    <button class="right" data-dir="right" aria-label="Right">▶</button>
  </div>
</main>

<script>
(() => {
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const overlay = document.getElementById("overlay");
  const overlayTitle = document.getElementById("overlayTitle");
  const overlayText = document.getElementById("overlayText");
  const startBtn = document.getElementById("startBtn");
  const pauseBtn = document.getElementById("pauseBtn");

  const GRID = 20;
  const CELL = canvas.width / GRID;

  let snake, food, direction, nextDirection;
  let score = 0;
  let best = Number(localStorage.getItem("snakeBest") || 0);
  let running = false;
  let paused = false;
  let gameOver = false;
  let timer = null;
  let speed = 145;

  bestEl.textContent = best;

  function reset() {
    snake = [
      {x: 10, y: 10},
      {x: 9, y: 10},
      {x: 8, y: 10}
    ];
    direction = {x: 1, y: 0};
    nextDirection = {x: 1, y: 0};
    score = 0;
    speed = 145;
    scoreEl.textContent = score;
    food = makeFood();
    running = true;
    paused = false;
    gameOver = false;
    hideOverlay();
    pauseBtn.textContent = "Pause";
    restartLoop();
    draw();
  }

  function makeFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    return pos;
  }

  function restartLoop() {
    clearInterval(timer);
    if (running && !paused) timer = setInterval(tick, speed);
  }

  function tick() {
    direction = nextDirection;

    const head = {
      x: snake[0].x + direction.x,
      y: snake[0].y + direction.y
    };

    const hitWall =
      head.x < 0 || head.x >= GRID ||
      head.y < 0 || head.y >= GRID;

    const eating = head.x === food.x && head.y === food.y;
    const bodyToCheck = eating ? snake : snake.slice(0, -1);
    const hitSelf = bodyToCheck.some(s => s.x === head.x && s.y === head.y);

    if (hitWall || hitSelf) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (eating) {
      score++;
      scoreEl.textContent = score;

      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem("snakeBest", best);
      }

      food = makeFood();
      speed = Math.max(55, 145 - score * 4);
      restartLoop();
    } else {
      snake.pop();
    }

    draw();
  }

  function endGame() {
    running = false;
    gameOver = true;
    clearInterval(timer);
    overlayTitle.textContent = "Game Over";
    overlayText.textContent = `Score: ${score} · Best: ${best}`;
    startBtn.textContent = "Play Again";
    overlay.classList.remove("hidden");
    draw();
  }

  function setDirection(dir) {
    if (!running || paused) return;

    const dirs = {
      up:    {x: 0, y: -1},
      down:  {x: 0, y: 1},
      left:  {x: -1, y: 0},
      right: {x: 1, y: 0}
    };

    const candidate = dirs[dir];
    if (!candidate) return;

    // Prevent an immediate 180-degree turn.
    if (candidate.x === -direction.x && candidate.y === -direction.y) return;
    nextDirection = candidate;
  }

  function togglePause() {
    if (!running && !gameOver) {
      reset();
      return;
    }
    if (!running) return;

    paused = !paused;
    pauseBtn.textContent = paused ? "Resume" : "Pause";

    if (paused) {
      clearInterval(timer);
      overlayTitle.textContent = "Paused";
      overlayText.textContent = "Take a breather. Press Space or Resume when you're ready.";
      startBtn.textContent = "Resume";
      overlay.classList.remove("hidden");
    } else {
      hideOverlay();
      restartLoop();
      draw();
    }
  }

  function hideOverlay() {
    overlay.classList.add("hidden");
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Food glow
    const fx = (food.x + 0.5) * CELL;
    const fy = (food.y + 0.5) * CELL;
    const glow = ctx.createRadialGradient(fx, fy, 2, fx, fy, CELL * .65);
    glow.addColorStop(0, "rgba(255, 93, 115, .35)");
    glow.addColorStop(1, "rgba(255, 93, 115, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(fx - CELL, fy - CELL, CELL * 2, CELL * 2);

    // Food
    ctx.fillStyle = "#ff5d73";
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * .29, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#8ef28f";
    ctx.beginPath();
    ctx.ellipse(fx + CELL * .13, fy - CELL * .27, CELL * .12, CELL * .06, -.6, 0, Math.PI * 2);
    ctx.fill();

    // Snake
    snake.forEach((part, i) => {
      const pad = i === 0 ? 1.5 : 2.5;
      const x = part.x * CELL + pad;
      const y = part.y * CELL + pad;
      const size = CELL - pad * 2;

      ctx.fillStyle = i === 0 ? "#b4ff73" : "#65e572";
      roundRect(ctx, x, y, size, size, i === 0 ? 7 : 5);
      ctx.fill();

      if (i === 0) {
        // Eyes
        ctx.fillStyle = "#0b1020";
        const eyeSize = CELL * .07;
        let ex1, ey1, ex2, ey2;

        if (direction.x !== 0) {
          const side = direction.x > 0 ? .68 : .32;
          ex1 = x + size * side;
          ex2 = ex1;
          ey1 = y + size * .31;
          ey2 = y + size * .69;
        } else {
          const side = direction.y > 0 ? .68 : .32;
          ey1 = ey2 = y + size * side;
          ex1 = x + size * .31;
          ex2 = x + size * .69;
        }

        ctx.beginPath();
        ctx.arc(ex1, ey1, eyeSize, 0, Math.PI * 2);
        ctx.arc(ex2, ey2, eyeSize, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  function roundRect(ctx, x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  document.addEventListener("keydown", e => {
    const key = e.key.toLowerCase();

    const map = {
      arrowup: "up", w: "up",
      arrowdown: "down", s: "down",
      arrowleft: "left", a: "left",
      arrowright: "right", d: "right"
    };

    if (map[key]) {
      e.preventDefault();
      if (!running && !gameOver) reset();
      setDirection(map[key]);
    }

    if (key === " ") {
      e.preventDefault();
      togglePause();
    }

    if (key === "enter" && gameOver) reset();
  });

  document.querySelectorAll(".dpad button").forEach(btn => {
    btn.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (!running && !gameOver) reset();
      setDirection(btn.dataset.dir);
    });
  });

  startBtn.addEventListener("click", () => {
    if (paused) togglePause();
    else reset();
  });

  pauseBtn.addEventListener("click", togglePause);

  // Swipe controls on the board.
  let touchStart = null;
  canvas.addEventListener("pointerdown", e => {
    touchStart = {x: e.clientX, y: e.clientY};
  });
  canvas.addEventListener("pointerup", e => {
    if (!touchStart) return;
    const dx = e.clientX - touchStart.x;
    const dy = e.clientY - touchStart.y;
    touchStart = null;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;

    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx > 0 ? "right" : "left");
    } else {
      setDirection(dy > 0 ? "down" : "up");
    }
  });

  // Initial screen.
  snake = [
    {x: 10, y: 10},
    {x: 9, y: 10},
    {x: 8, y: 10}
  ];
  food = {x: 14, y: 10};
  direction = {x: 1, y: 0};
  nextDirection = {x: 1, y: 0};
  draw();
})();
</script>
</body>
</html>
